name: "Drift Intent Check"
description: "Validate and summarize Drift intents on this pull request (PRD §14.4)."
author: "Drift"
inputs:
  command:
    description: "drift subcommand to run against the repo (log | doctor | verify <intent-id>)"
    default: "log"
  comment:
    description: "Post (or update in place) a Drift intent-summary comment on the PR. Requires GITHUB_TOKEN; skipped automatically on non-PR runs or repos without Drift intents."
    default: "true"
runs:
  using: "composite"
  steps:
    # The CLI runs straight from this checkout (dist/ is committed), so the
    # Action works today without anything published to npm. `npm ci` only
    # materialises the workspace links for @drift/core and @drift/ast.
    - name: "Install Drift CLI workspace deps"
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --no-audit --no-fund
    - name: "Run drift ${{ inputs.command }}"
      shell: bash
      run: |
        set +e
        DRIFT_OUTPUT="$(node "$GITHUB_ACTION_PATH/packages/drift-cli/dist/cli.js" $DRIFT_COMMAND --json 2>&1)"
        DRIFT_EXIT=$?
        echo "::group::drift output"
        echo "$DRIFT_OUTPUT"
        echo "::endgroup::"
        echo "drift_exit=$DRIFT_EXIT" >> "$GITHUB_ENV"
        exit $DRIFT_EXIT
      env:
        DRIFT_COMMAND: ${{ inputs.command }}
    # Idempotent provenance summary: posts once, then PATCHes the same
    # marker comment on every synchronize/force-push. Never spams.
    - name: "Post Drift PR summary comment"
      if: ${{ inputs.comment == 'true' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        DRIFT_CLI: ${{ github.action_path }}/packages/drift-cli/dist/cli.js
      run: node "$GITHUB_ACTION_PATH/scripts/pr-comment.mjs"
