name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: bash scripts/seed-demo.sh
      - name: "Demo smoke test: blame shows originating prompt"
        working-directory: examples/demo-repo
        run: |
          node ../../packages/drift-cli/dist/cli.js blame src/auth.ts --function refreshToken --json \
            | grep -q "Fix race condition in token refresh" \
            && echo "demo blame OK"
