name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build + typecheck (tsc -b)
        run: npm run build

      - name: Run the full test suite
        run: npm test

      - name: Eval harness regression gate
        run: npm run eval

      - name: MVS acceptance (PRD §4.2)
        shell: bash
        run: bash scripts/acceptance-mvs.sh

      - name: Package smoke test (npm pack chain, no registry)
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          for p in drift-ast drift-core drift-cli drift-mcp; do
            (cd "packages/$p" && npm pack --pack-destination "$tmp" >/dev/null)
          done
          mkdir -p "$tmp/app" && cd "$tmp/app"
          npm init -y >/dev/null
          npm install \
            "$tmp"/drift-ast-*.tgz \
            "$tmp"/drift-core-*.tgz \
            "$tmp"/drift-cli-*.tgz \
            "$tmp"/drift-mcp-*.tgz >/dev/null
          test -x node_modules/.bin/drift
          test -x node_modules/.bin/drift-mcp
          node_modules/.bin/drift version
